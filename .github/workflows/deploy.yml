name: Deploy to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Check out footPrint so the symlink src/samples/examples -> ../../../footPrint/examples resolves.
      - uses: actions/checkout@v4
        with:
          path: footprint-playground

      - uses: actions/checkout@v4
        with:
          repository: footprintjs/footPrint
          ref: v9.48.3
          path: footPrint

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Match the verified strict dependency resolver
        run: npm install --global npm@11.19.0

      # Keep authored links in Git; only this disposable checkout uses the
      # reviewed public package pins. Retain the existing lock's other entries.
      - name: Prepare reviewed published dependencies
        working-directory: footprint-playground
        run: |
          node scripts/prepare-ci-dependencies.mjs
          # Refresh only named replacements; npm install can retain a stale
          # same-version local link instead of recording the public package.
          npm update --package-lock-only footprintjs footprint-explainable-ui

      - run: npm ci
        working-directory: footprint-playground

      - run: npm ls footprintjs foottrace --all
        working-directory: footprint-playground

      - run: npm test
        working-directory: footprint-playground

      - run: npm run build
        working-directory: footprint-playground

      - run: cp dist/index.html dist/404.html
        working-directory: footprint-playground

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: footprint-playground/dist

  deploy:
    if: github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
